[mod-setting-name]
pastel-water-strength=Strength
pastel-water-color=Water color
pastel-water-deep-color=Deep water color

[mod-setting-description]
pastel-water-strength=How far to move water from its vanilla color toward the colors below. 0 = vanilla, 1 = fully the new color.
pastel-water-color=Target color for normal and shallow water, as a hex code like #7FDDE6.
pastel-water-deep-color=Target color for deep water, as a hex code like #4FC3D9.
